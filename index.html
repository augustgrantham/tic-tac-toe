<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="gameContainer">
        <div class="player 1">
            <input type="text" id="player1" name="player1" placeholder="Player 1" class="player1" value="Player 1">
        </div>
        <div class="boardContainer">
            <div class="box 0"></div>
            <div class="box 0 1"></div>
            <div class="box 0 2"></div>
            <div class="box 1 0"></div>
            <div class="box 1"></div>
            <div class="box 1 2"></div>
            <div class="box 2 0"></div>
            <div class="box 2 1"></div>
            <div class="box 2"></div>
        </div>
        <div class="player 2">
            <input type="text" id="player2" name="player2" placeholder="Player 2" class="player2" value="Player 2">
        </div>
    </div>
   
    <div class="console">
        <p class="feed"></p>
    </div>
</body>
</html>
