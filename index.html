<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="gameContainer">
        <div class="player 1">
            <input type="text" id="player1" name="player1" placeholder="Player 1" class="player1">
        </div>
        <div class="boardContainer">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
        </div>
        <div class="player 2">
            <input type="text" id="player2" name="player2" placeholder="Player 2" class="player2">
        </div>
    </div>
   
    <div class="console">
        <p class="feed"></p>
    </div>
</body>
</html>
